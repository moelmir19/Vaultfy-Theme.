name: Vaultfy theme checks

on:
  push:
    branches: [up-store-vaultfy-rebuild]
  pull_request:
    branches: [main]

jobs:
  theme-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install Twig for template validation
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP storefront bootstrap
        run: php -l index.php && php -l src/Twig/CustomTwigExtensions.php
      - name: Parse Twig storefront, product and cart templates
        run: php tests/twig-smoke.php
      - name: Check native category script syntax
        run: node --check assets/js/vaultfy-up.js
      - name: Validate Twsaa and Vaultfy theme contracts
        run: node --test tests/theme-contracts.test.js
